<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- v3 review viewer entry (no build / no npm / no CDN).
       Frontend is a trimmed copy of the v1 app; script order follows
       APP-API.md "目录与加载顺序". The single v3-specific extension is
       app/viewer-boot.js, loaded between store.js and main.js (it must be
       defined before main.js calls ViewerBoot.loadInitialDoc/attachAutoSave).
       /lib/* is served by viewer.py from v3-agent-plugin/lib. -->
  <title>科研绘图查看器 v3（人工复核）</title>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/editor.css">
  <link rel="stylesheet" href="styles/science.css">
</head>
<body>
  <div id="app">

    <!-- ============================ 顶栏 ============================ -->
    <header id="topbar">
      <button id="btn-new" title="新建空白工程">新建</button>
      <button id="btn-open" title="打开工程文件 (*.figureproj.json)">打开</button>
      <button id="btn-save" title="保存工程">保存</button>
      <span class="sep"></span>
      <button id="btn-undo" title="撤销 (Ctrl+Z)" disabled>撤销</button>
      <button id="btn-redo" title="重做 (Ctrl+Shift+Z)" disabled>重做</button>
      <span class="sep"></span>
      <button id="btn-group" title="编组选中元素" disabled>编组</button>
      <button id="btn-ungroup" title="解除编组" disabled>解组</button>
      <span class="sep"></span>
      <button id="btn-explode-chart" title="把选中图表拆为独立图形；每根柱子、坐标轴和文字可分别编辑（可撤销）" disabled>拆为图元</button>
      <button id="btn-align-left" title="左对齐" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><line x1="3" y1="2" x2="3" y2="14"/><rect x="5" y="4" width="8" height="3" fill="currentColor" stroke="none"/><rect x="5" y="9" width="5" height="3" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btn-align-center" title="水平居中" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><line x1="8" y1="2" x2="8" y2="14"/><rect x="4" y="4" width="8" height="3" fill="currentColor" stroke="none"/><rect x="6" y="9" width="4" height="3" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btn-align-right" title="右对齐" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><line x1="13" y1="2" x2="13" y2="14"/><rect x="3" y="4" width="8" height="3" fill="currentColor" stroke="none"/><rect x="6" y="9" width="5" height="3" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btn-align-top" title="顶对齐" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><line x1="2" y1="3" x2="14" y2="3"/><rect x="4" y="5" width="3" height="8" fill="currentColor" stroke="none"/><rect x="9" y="5" width="3" height="5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btn-align-middle" title="垂直居中" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><line x1="2" y1="8" x2="14" y2="8"/><rect x="4" y="4" width="3" height="8" fill="currentColor" stroke="none"/><rect x="9" y="6" width="3" height="4" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btn-align-bottom" title="底对齐" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><line x1="2" y1="13" x2="14" y2="13"/><rect x="4" y="3" width="3" height="8" fill="currentColor" stroke="none"/><rect x="9" y="6" width="3" height="5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btn-distribute-h" title="水平等距分布（需选中 ≥3 个）" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="5" width="2" height="6" fill="currentColor" stroke="none"/><rect x="7" y="5" width="2" height="6" fill="currentColor" stroke="none"/><rect x="12" y="5" width="2" height="6" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btn-distribute-v" title="垂直等距分布（需选中 ≥3 个）" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="2" width="6" height="2" fill="currentColor" stroke="none"/><rect x="5" y="7" width="6" height="2" fill="currentColor" stroke="none"/><rect x="5" y="12" width="6" height="2" fill="currentColor" stroke="none"/></svg>
      </button>
      <span class="sep"></span>
      <button id="btn-z-front" title="置于最前" disabled>置顶</button>
      <button id="btn-z-back" title="置于最后" disabled>置底</button>
      <button id="btn-z-forward" title="向前一层" disabled>上移</button>
      <button id="btn-z-backward" title="向后一层" disabled>下移</button>
      <span class="sep"></span>
      <button id="btn-export" title="导出 TIFF / PNG / JPG / SVG / PDF">导出</button>
      <button id="btn-review" title="AI 审阅当前图面">审阅</button>
      <button id="btn-settings" title="设置（DeepSeek Key / 代理 / 画布 DPI）">设置</button>
      <span class="sep"></span>
      <button id="zoom-out" title="缩小">−</button>
      <span id="zoom-level" title="当前缩放比例">100%</span>
      <button id="zoom-in" title="放大">＋</button>
      <button id="toggle-guides" title="显示锚点参考线" aria-pressed="true">参考线</button>
      <button id="toggle-snap" title="吸附到网格与元素边缘" aria-pressed="true">吸附</button>
    </header>

    <!-- ============================ 主区 ============================ -->
    <div id="main">

      <!-- 左：画布工作台（自适应宽度，深色） -->
      <section id="canvas-pane">
        <nav id="toolbar" aria-label="绘图工具">
          <button id="tool-select" title="选择" aria-pressed="true">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5 L12.5 8.2 L8.9 8.9 L10.9 13.4 L9 14.3 L7.1 9.9 L4 12.2 Z" fill="currentColor" stroke="none"/></svg>
          </button>
          <button id="tool-marquee" title="框选 / 选框">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="9" stroke-dasharray="3 2"/></svg>
          </button>
          <button id="tool-anchor" title="建锚点（命名区域，供 AI 定位）">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.5"/><line x1="8" y1="1.5" x2="8" y2="4"/><line x1="8" y1="12" x2="8" y2="14.5"/><line x1="1.5" y1="8" x2="4" y2="8"/><line x1="12" y1="8" x2="14.5" y2="8"/></svg>
          </button>
          <button id="tool-text" title="文本">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5 H12.5 M8 3.5 V13"/></svg>
          </button>
          <button id="tool-rect" title="矩形">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="4.5" width="11" height="7"/></svg>
          </button>
          <button id="tool-ellipse" title="椭圆">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="8" rx="5.5" ry="4"/></svg>
          </button>
          <button id="tool-line" title="直线">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><line x1="3" y1="13" x2="13" y2="3"/></svg>
          </button>
          <button id="tool-arrow" title="箭头">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><line x1="3" y1="13" x2="12.5" y2="3.5"/><polyline points="7.5 3.5 12.5 3.5 12.5 8.5"/></svg>
          </button>
          <button id="tool-image" title="置入图片">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1"/><circle cx="5.5" cy="6.5" r="1.3"/><path d="M3 12 L7 8.5 L9.5 11 L11.5 9 L14 11.5"/></svg>
          </button>
        </nav>
        <!-- Editor 挂载点：内含 #svg-stage 与 #overlay-layer -->
        <div id="stage" data-tool="select">
          <svg id="svg-stage" xmlns="http://www.w3.org/2000/svg"></svg>
          <svg id="overlay-layer" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="canvas-info"></div>
          <div id="zoom-badge"></div>
        </div>
      </section>

      <!-- 右：上半栏工具 + 下半栏固定 AI，两个方向的分隔互不影响 -->
      <aside id="side-pane">
        <div id="side-tools">
          <!-- Import mount: always-visible block above the tab bar -->
          <div id="panel-import"></div>
          <nav id="tabs" aria-label="工具面板切换">
            <button id="tab-science">论证</button>
            <button id="tab-diagram">实体关系</button>
            <button id="tab-anchors">锚点</button>
            <button id="tab-layers">图层</button>
            <button id="tab-props">属性</button>
            <button id="tab-templates">模板</button>
            <button id="tab-presets">期刊</button>
            <button id="tab-history">历史</button>
            <button id="tab-store">工程</button>
          </nav>
          <div id="panel-science" class="panel hidden"></div>
          <div id="panel-diagram" class="panel hidden"></div>
          <div id="panel-anchors" class="panel hidden"></div>
          <div id="panel-layers" class="panel hidden"></div>
          <div id="panel-props" class="panel hidden"></div>
          <div id="panel-templates" class="panel hidden"></div>
          <div id="panel-presets" class="panel hidden"></div>
          <div id="panel-history" class="panel hidden"></div>
          <div id="panel-store" class="hidden"></div>
        </div>
        <div id="ai-split-handle" class="ai-split-handle" role="separator"
             aria-orientation="horizontal" aria-label="调整 AI 对话高度"
             tabindex="0"></div>
        <div id="panel-ai" class="panel" aria-label="AI 对话"></div>
        <div id="panel-settings" class="hidden"></div>
      </aside>

    </div>

    <!-- ============================ 状态栏 ============================ -->
    <footer id="status-bar">
      <span id="status-text">就绪</span>
      <span id="status-doc-info"></span>
    </footer>

  </div>

  <!-- 模态框与 Toast 挂载点（为空时不遮挡交互） -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <noscript>
    <p style="color:#fff;padding:16px">本应用需要启用 JavaScript 才能运行。</p>
  </noscript>

  <!-- 固定加载顺序（APP-API.md 冻结，不得改动）：
       内核 lib/：figdoc → diagram → ops → science → palette → presets → data → render → tiff → export → ai → storage
       应用 app/：state → ui → editor → import → template-preview → diagram-panel → templates → presets → export → history → ai
                  → anchors → layers → props → settings → store → main -->
  <script src="lib/figdoc.js"></script>
  <script src="lib/diagram.js"></script>
  <script src="lib/ops.js"></script>
  <script src="lib/science.js"></script>
  <script src="lib/palette.js"></script>
  <script src="lib/presets.js"></script>
  <script src="lib/data.js"></script>
  <script src="lib/lineage.js"></script>
  <script src="lib/render.js"></script>
  <script src="lib/tiff.js"></script>
  <script src="lib/export.js"></script>
  <script src="lib/ai.js"></script>
  <script src="lib/storage.js"></script>
  <script src="app/state.js"></script>
  <script src="app/ui.js"></script>
  <script src="app/chart-render.js"></script>
  <script src="app/editor.js"></script>
  <script src="app/import.js"></script>
  <!-- Excel API 与旧导入入口的兼容适配；原生“导入数据”统一处理 CSV/JSON/Excel -->
  <script src="app/spreadsheet-import.js"></script>
  <script src="app/template-preview.js"></script>
  <script src="app/diagram-panel.js"></script>
  <script src="app/templates.js"></script>
  <script src="app/presets.js"></script>
  <script src="app/export.js"></script>
  <script src="app/history.js"></script>
  <script src="app/ai.js"></script>
  <script src="app/anchors.js"></script>
  <script src="app/layers.js"></script>
  <script src="app/props.js"></script>
  <script src="app/settings.js"></script>
  <script src="app/store.js"></script>
  <!-- v3 扩展：查看器与本地服务（viewer.py）的集成层，必须在 main.js 之前定义 -->
  <script src="app/viewer-boot.js"></script>
  <script src="app/science.js"></script>
  <script src="app/chart-edit.js"></script>
  <script src="app/main.js"></script>
</body>
</html>
